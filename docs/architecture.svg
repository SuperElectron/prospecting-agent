<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" font-family="monospace" font-size="13">
  <style>
    rect { fill: #f6f8fa; stroke: #24292f; rx: 6; }
    .store { fill: #ddf4ff; }
    .ext { fill: #fff8c5; }
    text { fill: #24292f; }
    line { stroke: #57606a; stroke-width: 1.5; marker-end: url(#a); }
  </style>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 z" fill="#57606a"/></marker></defs>

  <rect x="20" y="20" width="120" height="40"/><text x="35" y="45">CLI</text>
  <rect x="160" y="20" width="120" height="40"/><text x="175" y="45">worker</text>
  <rect x="300" y="20" width="140" height="40"/><text x="315" y="45">control API</text>

  <rect x="20" y="110" width="420" height="50"/><text x="35" y="140">jobs: JobKind registry, credit ledger, timeouts, cron</text>
  <rect x="20" y="200" width="420" height="50"/><text x="35" y="230">workflows: sync, discovery, research, outreach, analysis</text>

  <rect x="520" y="110" width="140" height="40" class="store"/><text x="535" y="135">Postgres</text>
  <rect x="520" y="170" width="140" height="40" class="store"/><text x="535" y="195">apalis queue</text>
  <rect x="520" y="230" width="140" height="40" class="store"/><text x="535" y="255">OpenMemory</text>

  <rect x="710" y="110" width="120" height="36" class="ext"/><text x="725" y="133">Apollo</text>
  <rect x="710" y="160" width="120" height="36" class="ext"/><text x="725" y="183">Tavily</text>
  <rect x="710" y="210" width="120" height="36" class="ext"/><text x="725" y="233">local LLM</text>
  <rect x="710" y="260" width="120" height="36" class="ext"/><text x="725" y="283">Gmail</text>

  <line x1="80" y1="60" x2="180" y2="110"/>
  <line x1="220" y1="60" x2="220" y2="110"/>
  <line x1="370" y1="60" x2="280" y2="110"/>
  <line x1="230" y1="160" x2="230" y2="200"/>
  <line x1="440" y1="130" x2="520" y2="130"/>
  <line x1="440" y1="150" x2="520" y2="185"/>
  <line x1="440" y1="235" x2="520" y2="250"/>
  <line x1="440" y1="215" x2="710" y2="128"/>
  <line x1="440" y1="222" x2="710" y2="178"/>
  <line x1="440" y1="228" x2="710" y2="228"/>
  <line x1="440" y1="240" x2="710" y2="278"/>

  <text x="20" y="330">Invariants: window-guarded sends - no double-send - shared Apollo ledger -</text>
  <text x="20" y="350">leased claims with bounded retries - fenced third-party text - merge-style dedupe</text>
  <text x="20" y="400">CSV in -> discover -> enrich -> research -> enroll -> send -> reply -> report</text>
</svg>
