[package]
name = "prospecting-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT-0"
description = "AI prospecting agent: lead discovery, research, and multi-channel outreach automation"
repository = "https://github.com/SuperElectron/prospecting-agent"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "migrate"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.1", features = ["v4", "serde"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"

[profile.release]
lto = true
strip = true

[dev-dependencies]
wiremock = "0.6.5"
