[package]
name = "prospecting-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT-0"
description = "AI prospecting agent: lead discovery, research, and multi-channel outreach automation"
repository = "https://github.com/SuperElectron/prospecting-agent"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.1", features = ["v4", "serde"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = "allow"

[profile.release]
lto = true
strip = true
